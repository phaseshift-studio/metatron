<script>
    // Languages are loaded via <script src> tags in header.html (they self-register
    // against the global hljs).  ES module `import` statements are a SyntaxError in
    // this classic script — they killed the whole block, including the CopyButtonPlugin
    // [copy] rollover and hljs.highlightAll().
    hljs.configure({
        ignoreUnescapedHTML: true,
        languages: ['mtron','java','bash','sql','json']
    });
    hljs.addPlugin(new CopyButtonPlugin({
        callback: function(text, el) {
            // Strip multi-line [== ... ==] comments
            text = text.replace(/\[==[\s\S]*?==\]/g, '');
            var inResult = false;
            return text.split('\n')
                .map(function(line) {
                    // mtron> prompt — exit result mode, include the input
                    if (/^\s*mtron>/.test(line)) {
                        inResult = false;
                        line = line.replace(/^\s*mtron>\s*/, '');
                        line = line.replace(/\[--[^\]\[]*--\]/g, '');
                        return line.trim();
                    }
                    // ==> result prefix — enter result mode, skip this line
                    if (/^\s*==>/.test(line)) {
                        inResult = true;
                        return null;
                    }
                    // Inside a multi-line result block — skip
                    if (inResult) return null;
                    // Regular line (continuation of input)
                    line = line.replace(/\[--[^\]\[]*--\]/g, '');
                    return line.trim();
                })
                .filter(function(line) { return line !== null && line.length > 0; })
                .join('\n');
        }
    }));
    if (!hljs.initHighlighting.called) {
        hljs.initHighlighting.called = true
        ;[].slice.call(document.querySelectorAll('pre.highlight > code[data-lang]')).forEach(function (el) {
            hljs.highlightBlock(el)
        })
    }
    document.querySelectorAll('.btn[data-bs-toggle="collapse"]').forEach(button => {
        button.addEventListener('click', () => {
            button.classList.toggle("active")
        });
    });
    hljs.highlightAll();
    /*document.querySelectorAll('code').forEach(block => {
        hljs.highlightBlock(block);
    });*/

    // ── Vanilla JS tab switching (replaces Zepto) ─────────────────
    function initTabs() {
        var primaries = document.querySelectorAll('.primary');
        if (primaries.length === 0) return;

        primaries.forEach(function(primary) {
            var sw = document.createElement('div');
            sw.className = 'switch';
            primary.insertBefore(sw, primary.firstChild);

            var titles = primary.getElementsByClassName('title');
            var primaryTitle = titles.length > 0 ? titles[0] : null;
            var primaryContent = primary.querySelectorAll(':scope > .content')[0];

            var item = document.createElement('div');
            item.className = 'switch--item selected';
            item.textContent = primaryTitle ? primaryTitle.textContent : '';
            // Click handler for the primary tab
            item.addEventListener('click', function() {
                var allItems = sw.querySelectorAll('.switch--item');
                for (var i = 0; i < allItems.length; i++)
                    allItems[i].classList.remove('selected');
                item.classList.add('selected');
                var allContent = primary.querySelectorAll(':scope > .content');
                for (var j = 0; j < allContent.length; j++)
                    allContent[j].classList.add('hidden');
                if (primaryContent) {
                    primaryContent.classList.remove('hidden');
                    if (window.MathJax) MathJax.Hub.Queue(['Typeset', MathJax.Hub, primaryContent]);
                }
            });
            sw.appendChild(item);
            if (primaryTitle) primaryTitle.style.display = 'none';
        });

        document.querySelectorAll('.secondary').forEach(function(secondary) {
            var candidate = secondary.previousElementSibling;
            while (candidate && !candidate.classList.contains('primary'))
                candidate = candidate.previousElementSibling;
            if (!candidate) return;

            var primary = candidate;
            var sw = primary.querySelector('.switch');
            if (!sw) return;

            var contents = secondary.querySelectorAll(':scope > .content');
            if (contents.length === 0) return;
            var content = contents[0];
            content.classList.add('hidden');
            primary.appendChild(content);

            var titles = secondary.getElementsByClassName('title');
            var title = titles.length > 0 ? titles[0] : null;
            var item = document.createElement('div');
            item.className = 'switch--item';
            item.textContent = title ? title.textContent : '';

            item.addEventListener('click', function() {
                var allItems = sw.querySelectorAll('.switch--item');
                for (var i = 0; i < allItems.length; i++)
                    allItems[i].classList.remove('selected');
                item.classList.add('selected');
                var allContent = primary.querySelectorAll(':scope > .content');
                for (var j = 0; j < allContent.length; j++)
                    allContent[j].classList.add('hidden');
                content.classList.remove('hidden');
                // Re-render math in newly visible content
                if (window.MathJax) MathJax.Hub.Queue(['Typeset', MathJax.Hub, content]);
            });

            sw.appendChild(item);
            secondary.parentNode.removeChild(secondary);
        });
    }

    // Run after MathJax v2 finishes typesetting (loaded sync at page bottom,
    // typesetting is queued, so 'load' + small delay ensures it completes)
    window.addEventListener('load', function() {
        setTimeout(initTabs, 200);
    });

    // ── Hash navigation into collapsed cards ─────────────────────
    (function() {
        function navigateToHash() {
            var hash = window.location.hash;
            if (!hash) return;
            var target = document.querySelector(hash);
            if (!target) return;
            var card = target.closest('.collapse');
            if (card && !card.classList.contains('show')) {
                card.addEventListener('shown.bs.collapse', function scrollAfter() {
                    card.removeEventListener('shown.bs.collapse', scrollAfter);
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                var inst = bootstrap.Collapse.getInstance(card)
                        || new bootstrap.Collapse(card, { toggle: false });
                inst.show();
            } else {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        window.addEventListener('hashchange', navigateToHash);
        window.addEventListener('load', function() {
            setTimeout(navigateToHash, 80);
        });
    })();

    // ── Section heading anchor links + copy-to-clipboard ──────────
    (function() {
        var toast = document.createElement('div');
        toast.className = 'heading-toast';
        toast.textContent = 'Link copied to clipboard';
        document.body.appendChild(toast);

        var toastTimer = null;
        function showToast() {
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1800);
        }

        document.querySelectorAll('h2[id]:not(.accordion-header), h3[id], h4[id], h5[id], h6[id]').forEach(function(heading) {
            var anchor = document.createElement('a');
            anchor.className = 'heading-anchor bi bi-link-45deg';
            anchor.href = '#' + heading.id;
            anchor.title = 'Copy link to this section';
            anchor.setAttribute('aria-label', 'Copy link to section');
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                var url = window.location.origin + window.location.pathname + '#' + heading.id;
                navigator.clipboard.writeText(url).then(function() {
                    anchor.classList.add('copied');
                    showToast();
                    setTimeout(function() { anchor.classList.remove('copied'); }, 1500);
                }).catch(function() {
                    // Fallback for older browsers
                    var tmp = document.createElement('input');
                    tmp.value = url;
                    document.body.appendChild(tmp);
                    tmp.select();
                    document.execCommand('copy');
                    document.body.removeChild(tmp);
                    anchor.classList.add('copied');
                    showToast();
                    setTimeout(function() { anchor.classList.remove('copied'); }, 1500);
                });
            });
            heading.appendChild(anchor);
        });
    })();
</script>
