# =============================================================================
#  metatron — Docker Compose deployment (the VM + a repl sidecar)
#  PhaseShift Studio, LLC
#
#  This file is the BOUNDARY: the image and its host couplings (socket, state
#  volume, ports, limits, healthcheck) plus the boot-args string that configures
#  the VM.  What runs INSIDE the deployment (space backends, identities) is the
#  boot profile's business — it pulls them through the mounted host socket
#  (dckrspace::T).  To ship a deployment, point METATRON_BOOT at your profile.
#
#  CONFIGURE IT — copy the env template and edit; every knob has its default:
#      cp .env.example .env        # then edit .env and `docker compose up -d`
#  The full reference (three kinds of knob, the ONE RULE, and the commented-out
#  alternatives — build-from-checkout, read-only rootfs, bind state, DNS, ...)
#  lives in README.md → "Compose".
#
#  QUICK START
#      docker compose up -d                                  # boot + healthcheck
#      docker compose logs -f metatron
#      docker compose --profile repl run --rm repl           # wsplus REPL against it
#      docker compose -f compose.yaml -f compose.infra.yaml up -d   # + backends
#      docker compose down                                   # keep the state volume
#      docker compose down -v                                # ... or wipe it too
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-metatron}

# --- reusable fragments (x- keys are ignored by compose; they exist so the
#     anchors below can be shared — a template device, not configuration) ----
x-logging: &default-logging
  driver: ${METATRON_LOG_DRIVER:-json-file}
  options:
    # rotate, or a long-lived server eventually fills the disk:
    max-size: "${METATRON_LOG_MAX_SIZE:-10m}"
    max-file: "${METATRON_LOG_MAX_FILE:-3}"

# The boot-args rec, folded to ONE line (a single argv entry — the entrypoint
# passes "$@" to BootLoader, which wants the whole rec as one argument).
# Everything after `boot=>` is optional: each boot module applies its own
# `.else()` default, so name only what you want to override.
x-metatron-command: &metatron-command >-
  [
    boot   =><${METATRON_BOOT:-boot/docker.boot.mtron}>,
    user   =><${METATRON_USER:-avatar}>,
    log    =>${METATRON_LOG:-info},
    data   =><${METATRON_DATA:-/home/metatron}>,
    console=>${METATRON_CONSOLE:-false},
    web=>[
      http=><http://${METATRON_BIND_IP:-0.0.0.0}:${METATRON_HTTP_PORT:-8777}>,
      ws  =><ws://${METATRON_BIND_IP:-0.0.0.0}:${METATRON_WS_PORT:-8555}>],
    typer/stage       =>[
          inst_dom    =>${METATRON_TYPER_INST_DOM:-true},
          inst_rng    =>${METATRON_TYPER_INST_RNG:-true},
          type_pred   =>${METATRON_TYPER_TYPE_PRED:-true},
          obj_write   =>${METATRON_TYPER_OBJ_WRITE:-true},
          code_resolve=>${METATRON_TYPER_CODE_RESOLVE:-false}],
    tracer/stack      =>[
           mtron_stack=>${METATRON_TRACER_MTRON_STACK:-true},
           java_stack =>${METATRON_TRACER_JAVA_STACK:-false}]
  ]

services:

  # --- the metatron VM: ws 8555 / http 8777 --------------------------------
  metatron:
    image: ${METATRON_IMAGE:-ghcr.io/phaseshift-studio/metatron:latest}
    # build from a checkout instead (needs the packaged uber-jar in target/;
    # `bin/metatron-docker image` does both steps):
    #   build:
    #     context: ${METATRON_BUILD_CONTEXT:-../..}
    #     dockerfile: dist/docker/Dockerfile
    container_name: ${METATRON_CONTAINER:-metatron}
    hostname: ${METATRON_HOSTNAME:-metatron}
    init: ${METATRON_INIT:-true}
    restart: ${METATRON_RESTART:-unless-stopped}
    # grace for the JVM shutdown hook after SIGTERM (BootLoader.close):
    stop_grace_period: ${METATRON_STOP_GRACE_PERIOD:-30s}

    command:
      - *metatron-command

    # one variable drives host AND container side (and the boot-args URIs and
    # the healthcheck) so the four cannot drift apart:
    ports:
      - "${METATRON_BIND_IP:-0.0.0.0}:${METATRON_WS_PORT:-8555}:${METATRON_WS_PORT:-8555}"
      - "${METATRON_BIND_IP:-0.0.0.0}:${METATRON_HTTP_PORT:-8777}:${METATRON_HTTP_PORT:-8777}"

    volumes:
      # host docker daemon → dckrspace::T pulls the space backends through it
      - /var/run/docker.sock:/var/run/docker.sock
      # VM state (persistent spaces + ~/.metatron). A named volume is seeded
      # from the image's /home/metatron (uid 10001) so it is writable as-is.
      - metatron-state:/home/metatron
      # dev loop — a checkout's boot/ and conf/ override the provided copies:
      # - ${METATRON_REPO:-../..}/boot:/app/boot:ro
      # - ${METATRON_REPO:-../..}/conf:/app/conf:ro
      # hand the VM docker credentials instead of the socket:
      # - ${HOME}/.docker/config.json:/home/metatron/.docker/config.json:ro

    # the runtime is uid 10001; add the host socket's group, else the CLI is denied:
    #   export METATRON_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
    group_add:
      - "${METATRON_DOCKER_GID:-0}"

    environment:
      # the java launcher reads this itself (heap = 75% of the memory limit;
      # OOM should restart the container rather than limp along):
      JAVA_TOOL_OPTIONS: "${METATRON_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}"
      TZ: "${METATRON_TZ:-UTC}"

    # same probe the image ships; spelled out so the timings are knobs:
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:${METATRON_HTTP_PORT:-8777}/ >/dev/null || exit 1" ]
      interval: ${METATRON_HEALTH_INTERVAL:-30s}
      timeout: ${METATRON_HEALTH_TIMEOUT:-5s}
      retries: ${METATRON_HEALTH_RETRIES:-3}
      # the VM binds its ports only after the boot file has been evaluated:
      start_period: ${METATRON_HEALTH_START_PERIOD:-20s}

    deploy:
      resources:
        limits:
          cpus: "${METATRON_CPUS:-2.0}"
          memory: ${METATRON_MEMORY:-2g}
        reservations:
          memory: ${METATRON_MEMORY_RESERVATION:-256m}

    logging: *default-logging

    # the JVM needs no capabilities at all, and must not gain any:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read-only rootfs works, but /tmp must be a writable+exec tmpfs (the
    # tree-sitter native lib is extracted there on every boot):
    # read_only: true
    # tmpfs:
    #   - /tmp:rw,exec,size=256m

    labels:
      com.phaseshift.metatron.role: "server"
      com.phaseshift.metatron.boot: "${METATRON_BOOT:-boot/docker.boot.mtron}"
      com.phaseshift.metatron.user: "${METATRON_USER:-avatar}"

    networks:
      - netatron

  # --- the REPL: a wsplus console sidecar (--profile repl) -------------------
  #   docker compose --profile repl run --rm repl
  repl:
    profiles: [ "repl" ]
    image: ${METATRON_IMAGE:-ghcr.io/phaseshift-studio/metatron:latest}
    container_name: ${METATRON_CONTAINER:-metatron}-repl
    # skip the VM entrypoint: wsplus is the client, not a second server
    entrypoint: [ "/app/bin/wsplus" ]
    command:
      - "ws://${METATRON_HOSTNAME:-metatron}:${METATRON_WS_PORT:-8555}/mtron"
    stdin_open: true
    tty: true
    restart: "no"
    depends_on:
      metatron:
        condition: service_healthy
    networks:
      - netatron

# -----------------------------------------------------------------------------
# Networks and volumes.  Both support a `name:` override so the docker objects
# can be named independently of the compose project.
# -----------------------------------------------------------------------------
networks:
  netatron:
    name: ${METATRON_NETWORK:-netatron}
    driver: ${METATRON_NETWORK_DRIVER:-bridge}
    # internal: true          # no egress: only in-network traffic
    # attachable: true        # let standalone containers join later

volumes:
  # VM state: the sqlite file (METATRON_DATA) and ~/.metatron.  Survives
  # `docker compose down`; removed only by `down -v` / `docker volume rm`.
  metatron-state:
    name: ${METATRON_STATE_VOLUME:-metatron-state}
    # bind it to a host directory instead (chown the dir to 10001:10001):
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: ${METATRON_STATE_DIR:-./state}

# The space backends (mariadb / gremlin / chroma) deliberately live in
# compose.infra.yaml, not here, so this file stays one service — see README.
