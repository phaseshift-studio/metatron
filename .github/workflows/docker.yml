# Builds and publishes the metatron container image to GHCR.
# `main` pushes publish `main` + `latest` (rolling until a stable release);
# `v*` tags also publish the versioned tag.  PRs build without pushing.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build the uber-jar
        run: mvn -B package -DskipTests

      - name: Resolve project version
        id: version
        run: |
          VER=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout -DskipTests)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Stage the jar for the image build
        run: cp "target/metatron-${{ steps.version.outputs.version }}-jar-with-dependencies.jar" metatron.jar

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE }}:main,${{ env.REGISTRY }}/${{ env.IMAGE }}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE }}:${GITHUB_REF#refs/tags/}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dist/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            METATRON_VERSION=${{ steps.version.outputs.version }}
